# AutoPipe 24/7 sur GitHub Actions - publication A L'HEURE EXACTE (MAX 2026-10-31).
#
# Probleme historique : `serve --once` publie immediatement, donc si le cron
# GitHub derive (voire est rate : 14:00Z du 2026-10-31), la video sort en
# retard. Nouveau modele : `serve-window` = UN job = UNE fenetre :
#   pre-generation -> attente sans derive -> preuve geo US EN DIRECT
#   (fail-closed) -> upload PRIVE a H-2 min -> bascule public PILE a H:00.
#
# 3 couches de cron par fenetre (tolerant au drift de GitHub) :
#   - pregen  : H-20 min -> pre-genere le contrat puis publie a H:00 ;
#   - main    : H:00     -> publie la fenetre (no-op si deja servie) ;
#   - safety  : H+10 min -> rattrape un cron principal rate.
# La premiere couche qui arrive publie ; les suivantes sortent proprement
# (already_served / anti-doublon multi-jobs, verrou de revendication 600 s).
# Fenetres : 00, 04, 08, 12, 16, 20 UTC (2026-11-11 : 6 publications/jour,
#   toutes les 4h — maximum autorise par le quota YouTube API par defaut).
# matching upload.post_hours_utc.
#   - workflow_dispatch = declenchement manuel (input at_hour optionnel).
#   - Les secrets (config avec cles, token OAuth YouTube, client_secret) sont
#     injectes depuis les secrets chiffres du depot : rien de sensible dans
#     l'historique git.
#   - Le dossier data/ (etat, contrat pending_publish.json, compteur) est
#     commite a la fin de chaque run pour persister d'un job a l'autre.
name: autopipe

on:
  schedule:
    # Fenetres 00/04/08/12/16/20 UTC : 6 publications/jour toutes les 4h.
    # pregen  : H-20 min (heure precedente) -> pre-genere puis publie a H:00
    # main    : H:00 -> publie la fenetre (no-op si deja servie)
    # safety  : H+10 -> rattrape un cron principal rate
    - cron: "40 23,3,7,11,15,19 * * *"
    - cron: "0 0,4,8,12,16,20 * * *"
    - cron: "10 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      at_hour:
        description: "Heure UTC de la fenetre (0-23 ; vide = prochaine fenetre planifiee)"
        required: false
        default: ""

# Le run commite l'etat (data/) a la fin -> droit d'ecriture requis.
permissions:
  contents: write

concurrency:
  group: autopipe-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # La couche pregen attend jusqu'a ~20 min avant la bascule ; un dispatch
    # manuel tres en avance attend davantage -> marge large.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ffmpeg (avec libass pour les sous-titres) + polices equivalentes Arial
      - name: Installer ffmpeg + polices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-liberation
          fc-cache -f

      - name: Installer les dependances Python
        run: pip install --no-cache-dir -r requirements.txt

      # Restauration de la config + credentials depuis les secrets chiffres.
      # gh secret set AUTOPIPE_TOML < autopipe.toml (cles incluses, chiffrees)
      # gh secret set ANALYTICS_TOKEN_JSON < token_analytics.json (scope dedie
      #   yt-analytics.readonly : boucle engagedViews / winner amplification)
      - name: Restaurer la configuration et les credentials
        env:
          AUTOPIPE_TOML: ${{ secrets.AUTOPIPE_TOML }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          ANALYTICS_TOKEN_JSON: ${{ secrets.ANALYTICS_TOKEN_JSON }}
        run: |
          set -euo pipefail
          test -n "$AUTOPIPE_TOML" || { echo "Secret AUTOPIPE_TOML manquant"; exit 1; }
          test -n "$YOUTUBE_TOKEN_JSON" || { echo "Secret YOUTUBE_TOKEN_JSON manquant"; exit 1; }
          printf '%s' "$AUTOPIPE_TOML" > autopipe.toml
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          if [ -n "${CLIENT_SECRET_JSON:-}" ]; then
            printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          fi
          # Token Analytics DEDIE (yt-analytics.readonly, token_analytics.json) :
          # sans lui, retention_for() renvoie [] et le bot publie A L'AVEUGLE
          # (aucun signal engagedViews, winner amplification inutilisable).
          if [ -n "${ANALYTICS_TOKEN_JSON:-}" ]; then
            printf '%s' "$ANALYTICS_TOKEN_JSON" > token_analytics.json
          else
            echo "WARN: secret ANALYTICS_TOKEN_JSON absent -> boucle engagedViews AVEUGLE (fix: gh secret set ANALYTICS_TOKEN_JSON < token_analytics.json)"
          fi
          mkdir -p data cache output assets
          chmod 600 token.json client_secret.json token_analytics.json 2>/dev/null || true

      # Sante du token YouTube AVANT de generer la video. Si une
      # re-autorisation est requise, envoie l'alerte Gmail (avec la marche a
      # suivre) puis arrete le run immediatement : ni calcul gaspille, ni
      # blocage sur un flow OAuth interactif impossible sur le runner.
      - name: Verifier le token YouTube (alerte Gmail si action requise)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m autopipe.cli check-token

      # Verrou geo US (fail-closed) : pre-flight peu couteux AVANT de generer.
      # La preuve EN DIRECT (force=True, bloquante) est de toute facon refaite
      # par serve-window juste avant l'upload.
      - name: Verifier la sortie US (verrou geo fail-closed)
        run: python -m autopipe.cli geo-check

      # Quelle fenetre ? github.event.schedule = l'expression cron EXACTE qui a
      # declenche le run (fiable meme si l'heure reelle a derive) ; en dispatch
      # manuel, l'input at_hour. Vide -> run_window_once choisit la prochaine
      # fenetre planifiee.
      - name: Determiner la fenetre cible
        id: window
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_HOUR: ${{ github.event.inputs.at_hour }}
          # Doit matcher upload.post_hours_utc (secret AUTOPIPE_TOML).
          WINDOWS_UTC: "0 4 8 12 16 20"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, datetime as dt

          now = dt.datetime.now(dt.timezone.utc)
          windows = sorted({int(x) % 24 for x in
                            os.environ.get('WINDOWS_UTC', '').split()
                            if x.strip().isdigit()})
          sched = os.environ.get('SCHEDULE') or ''
          disp = (os.environ.get('DISPATCH_HOUR') or '').strip()
          hour = None
          if disp:
              # Garde-fou (2026-11-02 : dispatch at_hour='check' -> argparse
              # exit 2, run rouge + email) : n'accepter qu'un entier 0-23 ;
              # toute autre valeur est ignoree -> prochaine fenetre auto.
              if disp.isdigit() and int(disp) <= 23:
                  hour = int(disp) % 24
              else:
                  print('WARN: at_hour=%r invalide (entier 0-23 attendu) -> auto' % disp)
          elif sched.startswith('40 '):
              # Couche pregen (crons H-20) : cible = PROCHAINE fenetre dans
              # [now+10 min, now+30 min] -> tolerant a un demarrage tardif
              # du runner (0-19 min de retard) sans jamais cibler la mauvaise
              # fenetre ; au-dela, aucune cible fiable -> pas de publication
              # ici (le fallback a H+7 rattrapera la fenetre en retard).
              lo = now + dt.timedelta(minutes=10)
              hi = now + dt.timedelta(minutes=30)
              cands = []
              for h in windows:
                  t = now.replace(hour=h, minute=0, second=0, microsecond=0)
                  if lo <= t <= hi:
                      cands.append(t)
              if cands:
                  hour = min(cands).hour
          else:
              # Couches main (H:00) / safety (H+10) : la fenetre dont H:00
              # est dans [now-25 min, now+5 min] (tolere le retard du
              # runner) ; la plus recente gagne.
              lo = now - dt.timedelta(minutes=25)
              hi = now + dt.timedelta(minutes=5)
              cands = []
              for h in windows:
                  t = now.replace(hour=h, minute=0, second=0, microsecond=0)
                  if lo <= t <= hi:
                      cands.append(t)
              if cands:
                  hour = max(cands).hour
          if hour is None:
              print('Fenetre ciblee: auto (prochaine fenetre)')
          else:
              print('Fenetre ciblee: %02d:00 UTC' % hour)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('hour=%s\n' % ('' if hour is None else hour))
          PY

      # UN job = UNE fenetre : pre-generation, attente exacte, preuve geo US
      # en direct, upload prive a H-2 min, bascule public PILE a H:00.
      # Sortie 0 sans publication (already_served, outside_horizon, quota,
      # pending_mismatch, claimed_by_other, no_windows) : job vert, pas d'email.
      # Echec reel -> exit 1 -> job rouge + notify-failure.
      - name: Publier la fenetre a l'heure exacte
        env:
          AT_HOUR: ${{ steps.window.outputs.hour }}
        run: |
          if [ -n "$AT_HOUR" ]; then
            # Fenetre EXPLICITE (cron OU dispatch manuel avec at_hour) :
            # horizon desactive (0) -> meme declenche tres en avance, le job
            # attend et publie PILE a l'heure (garde-fou : timeout du job).
            python -m autopipe.cli serve-window --at-hour "$AT_HOUR" \
              --horizon-min 0
          else
            # Dispatch sans heure : prochaine fenetre planifiee, horizon
            # par defaut (75 min) -> skip propre si trop loin.
            python -m autopipe.cli serve-window
          fi

      # Persistance de l'etat (data/) : historique radar/remake, compteur
      # d'uploads, fenetres servies (anti-doublon), contrat de publication.
      # Races entre jobs : rebase en favorisant NOTRE etat data/ (le plus
      # frais) puis push, avec retries.
      - name: Commiter l'etat du bot
        if: always()
        run: |
          git config user.name "autopipe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          if git diff --cached --quiet; then
            echo "Etat inchange"
          else
            git commit -m "etat du bot: $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin main \
               && git push origin HEAD:main; then
              ok=1
              break
            fi
            echo "Race push (essai $i/5) -> nouvelle tentative"
            sleep $((i * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "WARN: push de l'etat echoue apres retries (l'etat reste local au job)"
          fi

      # Alerte Gmail si le run echoue : email "re-autorisation" si le token
      # est en cause (anti-spam 24 h, pas de doublon avec check-token), sinon
      # email "echec de run" avec le lien vers les logs.
      - name: Alerte Gmail en cas d'echec
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m autopipe.cli notify-failure --force
